# Application Configuration
spring.application.name=startkit-app
server.port=8080
server.servlet.context-path=/api

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/springboot_start_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JWT Configuration (NEVER commit these to Git - use environment variables)
# Generate a secure 512-bit (64 bytes) Base64 key:
# openssl rand -base64 64
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=900000
# 15 minutes (in milliseconds)
jwt.refresh-expiration=604800000
# 7 days (in milliseconds)
jwt.issuer=procurement-system

# Cookie Configuration
# IMPORTANT: Set these for production
cookie.domain=${COOKIE_DOMAIN:localhost}
# Set to your production domain in production (e.g., .yourdomain.com)
cookie.secure=${COOKIE_SECURE:false}
# MUST be true in production (requires HTTPS)
cookie.access-token-name=access_token
cookie.refresh-token-name=refresh_token

# Security Configuration
security.max-failed-attempts=5
security.lockout-duration-minutes=15
security.max-refresh-tokens-per-user=5

# Email Configuration
spring.mail.host=${SMTP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application Info
app.name=Procurement System
app.url=${APP_URL:http://localhost:3000}
app.email.from=noreply@procurement.com
app.email.from-name=Procurement System
app.frontend.url=http://localhost:3000
app.support.email=support@procurement.com

# Logging
logging.level.root=INFO
logging.level.com.bmglewis=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/procurement-app.log

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# Validation
spring.jackson.deserialization.fail-on-unknown-properties=true

# CORS (additional configuration in SecurityConfiguration)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}